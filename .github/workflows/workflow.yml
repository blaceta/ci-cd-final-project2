name: CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar entorno (Python)
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flake8 nose
        # pip install -r requirements.txt (si tienes este archivo)

    # FRAGMENTO PARA EL PASO DE LINT (flake8)
    - name: Lint con flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # FRAGMENTO PARA EJECUTAR PRUEBAS UNITARIAS (nose)
    - name: Ejecutar pruebas unitarias con nose
      run: |
        nosetests -v
